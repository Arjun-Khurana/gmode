[project]
name = "gmode"
version = "0.1.0"
description = "Graphical waveguide mode solver: finite-difference eigenmode solver with PML, optional MPB backend"
readme = "README.md"
authors = [{ name = "Arjun Khurana" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "matplotlib>=3.7",
    "pymetis>=2025.2.2; sys_platform != 'win32'",  # optional speedup; no Windows wheels
]

[project.scripts]
gmode-gui = "gmode.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]

[dependency-groups]
dev = [
    "mpmath>=1.4.1",
    "pytest>=8",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mpb: requires the meep/MPB python package", "gui: needs PySide6 and pyqtgraph"]
