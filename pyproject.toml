[project]
name = "gmode"
version = "0.1.0"
description = "Graphical waveguide mode solver: finite-difference eigenmode solver with PML, optional MPB backend"
readme = "README.md"
authors = [{ name = "Arjun Khurana" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "matplotlib>=3.7",
    "pymetis>=2025.2.2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mpb: requires the meep/MPB python package"]
