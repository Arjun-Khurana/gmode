name: release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to build the installers on all
# three systems, self-test each one, and attach them to a draft GitHub release for you to review
# and publish. Running the workflow by hand (Actions tab, "Run workflow") builds and tests the
# installers without releasing; they appear as artifacts on the run's page. Pull requests that touch
# the packaging also build and test them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml", "pyproject.toml"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest }
          - { name: macOS (Intel), os: macos-15-intel }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-22.04 }  # oldest supported glibc, so the AppImage runs on more distros
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in pyproject.toml"; exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 desktop-file-utils

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build, package and self-test
        run: uv run --extra gui --with pyinstaller --with pillow python packaging/build.py --test

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Wheel and source archive
        run: uv build --out-dir dist/release

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/release
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --draft --verify-tag \
            --title "GMode ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md --generate-notes
